# Production profile. Every value here resolves from an environment variable, so
# this file carries no credentials and is safe to commit. If you find yourself
# pasting a literal secret in, put it in the environment instead.
#
# Required: DB_HOST_URL DB_NAME DB_USERNAME DB_PASSWORD
#           JWT_SECRET_KEY FRONTEND_URL
#           STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET

# --- Database -----------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST_URL}:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Schema -------------------------------------------------------------------
# Flyway applies classpath:db/migration on startup. Hibernate then validates.
# Do not set ddl-auto=update/create here — that races with migrations and can
# wipe production data. Shared setting lives in application.properties.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Keeps a database connection open for the whole request. Left on because several
# read paths still rely on lazy loading during response mapping.
spring.jpa.open-in-view=true

# --- Auth ---------------------------------------------------------------------
# At least 32 characters. Anyone holding this can mint a token for any user id.
# Generate with: openssl rand -base64 48
jwt.secretKey=${JWT_SECRET_KEY}
jwt.access-token-validity=10m

# Tokens are stateless, so logout clears the cookie but cannot revoke the token.
# This window is the real limit on a stolen refresh token.
jwt.refresh-token-validity=7d

app.cookie.secure=true

# --- Frontend -----------------------------------------------------------------
# The SPA origin. Used for Stripe return URLs and as the CORS allow-list entry,
# so pointing it at the API would break both.
frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${FRONTEND_URL}

# --- Stripe -------------------------------------------------------------------
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# --- Seed data ----------------------------------------------------------------
# Off deliberately. The seeder falls back to well-known default passwords.
app.seed.enabled=false
