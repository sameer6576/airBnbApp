spring.application.name=airBnbApp

# Shared configuration only. Nothing environment-specific and no credentials
# belong in this file — those live in application-dev.properties (local, ignored
# by git) or come from environment variables in application-prod.properties.
#
# An env var or CLI argument overrides this, so `SPRING_PROFILES_ACTIVE=prod` or
# `-Dspring.profiles.active=prod` wins without editing the file.
spring.profiles.active=dev

server.servlet.context-path=/api/v1

# How long inventory stays soft-reserved before the expiry job releases it.
app.booking.reservation-hold-minutes=10

# Extended once payment starts. Keep this at 30 or above: the Stripe Checkout
# Session is pinned to this deadline, and Stripe refuses a session lifetime under
# 30 minutes, so a shorter hold cannot be enforced on their side.
app.booking.payment-hold-minutes=30

# Full refund this many days before check-in, partial refund inside that window.
app.cancellation.free-cancel-days=7
app.cancellation.partial-refund-percent=50

# Notifications log by default. Set true and configure spring.mail.* to send.
app.mail.enabled=false

# MM-dd dates attracting the holiday pricing multiplier. Unset, that strategy is
# a no-op, which is why it silently never applied in production.
app.holidays.dates=01-01,12-25

# --- Scheduling ---------------------------------------------------------------
# Externalised so a noisy local log can be quieted without changing production
# timing. Set any of these to "-" to disable that job.
#
# The expiry job must run at least as often as the shortest hold, and the warning
# job looks only a couple of minutes ahead, so both are per-minute. They are
# offset by 30 seconds to avoid contending on the same rows.
app.scheduling.booking-expiry.cron=0 * * * * *
app.scheduling.expiry-warning.cron=30 * * * * *
app.scheduling.pricing-update.cron=0 0 * * * *

# Rolls the bookable window forward. Without this the horizon shrinks by a day
# every day, because inventory is generated relative to "today".
app.scheduling.inventory-horizon.cron=0 30 3 * * *

# How many days ahead inventory is kept populated.
app.inventory.horizon-days=365

# --- Actuator ----------------------------------------------------------------
# Health only. Metrics and env are not exposed, since the whole surface would
# otherwise be reachable through the permitAll rule on the health endpoint.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Details are for authenticated callers; anonymous probes see UP or DOWN only.
management.endpoint.health.show-details=when-authorized

# The point of the exercise: readiness now fails when the database is unreachable,
# instead of reporting healthy the way the old hand-rolled endpoint did. Boot's db
# indicator runs a real validation query against the connection pool.
management.endpoint.health.group.readiness.include=readinessState,db

# spring-boot-starter-mail is on the classpath, so actuator would otherwise add a
# mail indicator that tries to reach an SMTP server and reports DOWN when mail is
# intentionally unconfigured.
management.health.mail.enabled=false
